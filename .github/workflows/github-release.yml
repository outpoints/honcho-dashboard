# Create the GitHub Release only after its multi-arch container image publishes.
# workflow_run executes from the default branch and receives a contents:write
# token without requiring a maintainer's local GitHub CLI credentials.
name: GitHub Release

on:
  workflow_run:
    workflows: ["Docker Release"]
    types: [completed]

permissions:
  contents: write

jobs:
  create-release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Create release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 ||
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --generate-notes \
              --title "Honcho Dashboard ${RELEASE_TAG#v}"
