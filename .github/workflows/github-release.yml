# Create the GitHub Release only after its multi-arch container image publishes.
# workflow_run executes from the default branch and receives a contents:write
# token without requiring a maintainer's local GitHub CLI credentials.
name: GitHub Release

on:
  workflow_run:
    workflows: ["Docker Release"]
    types: [completed]

permissions:
  contents: write

jobs:
  create-release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Create release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            exit 0
          fi

          notes_file=".github/release-notes/${RELEASE_TAG}.md"
          if [[ -f "$notes_file" ]]; then
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --notes-file "$notes_file" \
              --title "Honcho Dashboard ${RELEASE_TAG#v}"
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --generate-notes \
              --title "Honcho Dashboard ${RELEASE_TAG#v}"
          fi
